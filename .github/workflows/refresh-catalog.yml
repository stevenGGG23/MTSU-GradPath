# Re-exports the MTSU undergraduate catalog and opens a pull request when
# anything changed (new catalog year, edited courses or programs).
# Runs monthly and can be started by hand from the Actions tab.
#
# Needs: Settings -> Actions -> General -> "Allow GitHub Actions to create
# and approve pull requests" turned on.
name: Refresh catalog data

on:
  workflow_dispatch:
  schedule:
    - cron: "0 9 1 * *"  # 09:00 UTC on the 1st of each month

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements-dev.txt

      - name: Export catalog
        env:
          SECRET_KEY: ci-only
        run: python scrape_courses.py --refresh

      - name: Run tests against the new data
        env:
          SECRET_KEY: ci-only
        run: python -m pytest -q tests

      - name: Open pull request
        uses: peter-evans/create-pull-request@v6
        with:
          branch: catalog-refresh
          commit-message: Refresh catalog data from catalog.mtsu.edu
          title: Refresh catalog data
          body: |
            Automated re-export of the current MTSU undergraduate catalog
            (`python scrape_courses.py --refresh`). Tests passed against the new data.
            Review the diff of `catalog_data/catalog.json` for changed courses and programs.
          add-paths: catalog_data/catalog.json
