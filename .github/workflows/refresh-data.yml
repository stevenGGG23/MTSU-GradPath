# Keeps GradPath's data current with no one maintaining it:
#   - every Monday: MTSU's class schedule (which terms each course runs)
#   - the 1st of each month: the full catalog too (courses, majors, minors)
# Before publishing, the new data must pass the checks that mean the site
# works -- every major plans cleanly and reaches 100% -- and only then is it
# committed to main (which redeploys the site). If anything fails, nothing is published, the
# site keeps serving its last good data, and an issue is opened.
#
# The weekly run always commits (the schedule's timestamp changes), which
# also keeps GitHub from disabling this workflow for inactivity.
name: Refresh catalog and schedule

on:
  workflow_dispatch:
    inputs:
      catalog:
        description: "Also re-download the full catalog (~40 min)"
        type: boolean
        default: false
  schedule:
    - cron: "0 8 * * 1"  # Mondays 08:00 UTC: class schedule
    - cron: "0 9 1 * *"  # 1st of the month 09:00 UTC: catalog + schedule

permissions:
  contents: write
  issues: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements-dev.txt

      - name: Refresh the full catalog
        if: github.event.schedule == '0 9 1 * *' || inputs.catalog
        env:
          SECRET_KEY: ci-only
        run: python scrape_courses.py --refresh

      - name: Refresh the class schedule
        env:
          SECRET_KEY: ci-only
        run: python scrape_courses.py --schedule

      # The gate: checks that mean the site would be broken with this data.
      # (Tests that pin specific facts -- "Accounting requires ACTG 3110" --
      # run after publishing instead, so a real catalog change can't block
      # the refresh; see "Spot checks" below.)
      - name: Test that the site works with the new data
        env:
          SECRET_KEY: ci-only
        run: >
          python -m pytest -q
          tests/test_catalog_build.py tests/test_catalog_programs.py tests/test_production.py
          tests/test_catalog_majors.py
          -k "every_catalog_major or every_catalog_minor or every_major_page or partial_progress
          or finishing_everything or plan_page_for_catalog_majors or course_search_json
          or whole_undergraduate_catalog or test_catalog_build or test_catalog_programs or test_production"

      - name: Publish
        run: |
          git config user.name "gradpath-data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog_data/
          if git diff --cached --quiet; then
            echo "No data changes."
            exit 0
          fi
          git diff --cached --stat
          git commit -m "Refresh catalog/schedule data from MTSU (automated)"
          # Someone may have pushed to main while this ran: replay the data
          # commit on top of the latest main (it only touches catalog_data/)
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main && git push && exit 0
            echo "Push attempt $attempt failed; retrying"
            sleep $((attempt * 10))
          done
          exit 1

      - name: Spot checks
        id: spot
        continue-on-error: true
        env:
          SECRET_KEY: ci-only
        run: python -m pytest -q tests

      - name: Report spot checks that drifted
        if: steps.spot.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "Catalog changed: update spot-check tests ($(date -u +%Y-%m-%d))" \
            --body "The new catalog/schedule data was published (the site works with it), but some tests that check specific courses or programs now fail -- probably because MTSU changed that course or program. Update those tests to the new facts. Run log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            || true

      - name: Report a failure
        if: failure() && steps.spot.outcome != 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "Data refresh failed ($(date -u +%Y-%m-%d))" \
            --body "The automated catalog/schedule refresh failed, so nothing was published and the site is still serving its last good data. Run log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          Common causes: catalog.mtsu.edu or ssb.mtsu.edu was down or rate-limiting (re-run the workflow later), or MTSU changed its catalog/schedule format (see mtsugradpath/catalog_fetch.py and schedule_fetch.py)." \
            || true
